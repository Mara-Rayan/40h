  /* =============== Karten-Texturen (Canvas 2D) =============== */
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    lines.push(line);
    const shown = lines.slice(0, maxLines);
    if (lines.length > maxLines) shown[maxLines - 1] = shown[maxLines - 1].replace(/\s?\S*$/, "") + " …";
    shown.forEach((l, i) => ctx.fillText(l, x, y + i * lineH));
  }

  function makeCardTexture(t, i) {
    const W = 512, H = Math.round(512 * CH / CW);   // gleiches Seitenverhältnis wie die Fläche
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");

    // Kartenkörper
    roundRect(ctx, 0, 0, W, H, 36);
    ctx.fillStyle = "#1f1d1a";
    ctx.fill();
    ctx.save(); ctx.clip();

    // Farbfläche oben
    const g = ctx.createLinearGradient(0, 0, W, H * 0.5);
    g.addColorStop(0, t.c1); g.addColorStop(1, t.c2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.5);

    // Nummer
    ctx.fillStyle = "rgba(0,0,0,.28)";
    roundRect(ctx, 28, 26, 96, 36, 18); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "700 20px Inter, system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText(`${String(i + 1).padStart(2, "0")} / ${N}`, 46, 45);

    // Icon
    ctx.font = "150px system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.icon, W / 2, H * 0.27);
    ctx.textAlign = "left";

    // Titel + Teaser
    ctx.fillStyle = "#f1ede6";
    ctx.font = "700 38px Inter, system-ui, sans-serif";
    ctx.textBaseline = "alphabetic";
    wrapText(ctx, t.title, 32, H * 0.5 + 62, W - 64, 44, 2);
    ctx.fillStyle = "#a39d92";
    ctx.font = "400 25px Inter, system-ui, sans-serif";
    wrapText(ctx, t.teaser, 32, H * 0.5 + 150, W - 64, 36, 4);

    // Fußzeile
    ctx.fillStyle = "#a39d92";
    ctx.font = "400 21px Inter, system-ui, sans-serif";
    ctx.fillText(`${t.read} Lesezeit`, 32, H - 40);
    ctx.fillStyle = "#fb923c";
    ctx.font = "700 23px Inter, system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Lesen →", W - 32, H - 40);
    ctx.restore();

    // feine Kante
    roundRect(ctx, 1.5, 1.5, W - 3, H - 3, 35);
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 3; ctx.stroke();

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    return tex;
  }

  // Spiegelung: vertikal gekippte Karte mit eingebranntem Alpha-Verlauf
  function makeReflectionTexture(tex) {
    const src = tex.image;
    const c = document.createElement("canvas");
    c.width = src.width; c.height = src.height;
    const ctx = c.getContext("2d");
    ctx.translate(0, c.height); ctx.scale(1, -1);
    ctx.drawImage(src, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "destination-in";
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, "rgba(0,0,0,.35)");
    g.addColorStop(0.55, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    const r = new THREE.CanvasTexture(c);
    r.colorSpace = THREE.SRGBColorSpace;
    return r;
  }

  /* =============== Szene =============== */
  let renderer;

  const ring   = new THREE.Group();

  const geo = new THREE.PlaneGeometry(CW, CH);

    const a = i * STEP;
    mesh.position.set(Math.sin(a) * RADIUS, 0, Math.cos(a) * RADIUS);
    mesh.rotation.y = a;                 // nach außen schauen
    mesh.userData = { index: i, angle: a };
    ring.add(mesh);

    const rmat = new THREE.MeshBasicMaterial({ map: makeReflectionTexture(tex), transparent: true, depthWrite: false, side: THREE.FrontSide });
    const refl = new THREE.Mesh(geo, rmat);
    refl.position.set(mesh.position.x, -CH - 0.08, mesh.position.z);
    refl.rotation.y = a;
    ring.add(refl);
    return { mesh, refl, mat, rmat };
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Bei schmalen Bühnen weiter weg, damit die vordere Karte ganz zu sehen ist
    const dist = 6.6 * Math.max(1, 1.9 / camera.aspect);
    camera.position.set(0, 1.4, RADIUS + dist);
    camera.lookAt(0, -0.35, 0);
    camera.updateProjectionMatrix();
  }

  addEventListener("resize", resize);

  /* =============== Rotation & Auswahl =============== */
  let rot = 0, targetRot = 0, dragging = false;
  let mouseX = 0, parX = 0;

  const mod = (a, n) => ((a % n) + n) % n;
  function indexAt(angle) { return mod(Math.round(-angle / STEP), N); }

  function select(i, animate = true) {
    current = mod(i, N);
    if (animate) {
      const base = -current * STEP;
      const k = Math.round((rot - base) / TAU);        // kürzester Weg
      targetRot = base + k * TAU;
    }
    dotEls.forEach((d, k) => { d.classList.toggle("active", k === current); d.setAttribute("aria-selected", k === current); });
    label.textContent = `${ARTICLES[current].icon}  ${ARTICLES[current].title}`;
    renderArticle(current);
  }
  function snap() { select(indexAt(targetRot), true); }

  /* Buttons, Punkte, Tastatur */
  document.getElementById("prev").addEventListener("click", () => select(current - 1));
  document.getElementById("next").addEventListener("click", () => select(current + 1));
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); select(current + 1); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); select(current - 1); }
  });
  const dotEls = ARTICLES.map((t, i) => {
    const d = document.createElement("button");
    d.className = "dot"; d.type = "button"; d.setAttribute("role", "tab"); d.setAttribute("aria-label", t.title);
    d.addEventListener("click", () => select(i));
    dots.appendChild(d);
    return d;
  });

  /* Mausrad: dreht den Ring und rastet danach ein */
  let wheelTimer;
  stage.addEventListener("wheel", e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    targetRot -= d * 0.0025;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(snap, 140);
  }, { passive: false });

  /* Ziehen & Klicken (Raycast) */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(cards.map(c => c.mesh))[0];
    return hit ? hit.object.userData.index : -1;
  }

  let startX = 0, startRot = 0, lastX = 0, vel = 0, moved = false;
  stage.addEventListener("pointerdown", e => {
    dragging = true; moved = false;
    startX = lastX = e.clientX; startRot = rot; vel = 0;
    stage.classList.add("dragging");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    const r = renderer.domElement.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width) * 2 - 1;
    if (!dragging) {
      renderer.domElement.style.cursor = pick(e) >= 0 ? "pointer" : "grab";
      return;
    }
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 6) moved = true;
    vel = e.clientX - lastX; lastX = e.clientX;
    rot = startRot + dx * 0.006;
    targetRot = rot;
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove("dragging");
    if (!moved) {
      const i = pick(e);
      if (i >= 0) {
        select(i);
        main.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      return;
    }
    const flick = Math.max(-40, Math.min(40, vel));   // Schwung begrenzen
    targetRot = rot + flick * 0.02;
    snap();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("pointerleave", () => { mouseX = 0; });

  /* =============== Render-Schleife =============== */
  function frame() {
    if (!dragging) rot += (targetRot - rot) * 0.1;
    ring.rotation.y = rot;

    parX += (mouseX * 0.5 - parX) * 0.05;
    camera.position.x = parX;
    camera.lookAt(0, -0.35, 0);

    for (const { mesh, refl, mat, rmat } of cards) {
      const c = Math.cos(mesh.userData.angle + rot);         // 1 = ganz vorn
      const front = Math.max(0, c) ** 6;
      const s = 1 + 0.12 * front;
      mesh.scale.set(s, s, 1);
      mesh.position.y = 0.18 * front;
      mat.opacity = 0.25 + 0.75 * ((c + 1) / 2) ** 2;
      refl.scale.set(s, s, 1);
      refl.position.y = -CH - 0.08 - 0.18 * front;
      rmat.opacity = mat.opacity;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  /* =============== Artikel =============== */
  function renderArticle(i) {
    const t = ARTICLES[i];
    const paras = t.text;                    // eigener Text pro Beitrag
    const lead = paras[0] ?? "";
    const middle = paras.slice(1);
    const quoteIdx = Math.min(2, middle.length - 1);
    const quote = middle.length > 1 ? middle.splice(quoteIdx, 1)[0] : null;
    const prev = ARTICLES[mod(i - 1, N)], next = ARTICLES[mod(i + 1, N)];
    main.innerHTML = `
      <article style="--c1:${t.c1}">
        <span class="tag">${t.icon} ${t.title}</span>
        <h2>${t.headline}</h2>
        <p class="byline">Von ${t.author} · ${t.date} · ${t.read} Lesezeit</p>
        <p class="lead">${lead}</p>
        ${middle.map(p => `<p>${p}</p>`).join("")}
        ${quote ? `<blockquote>„${quote}“</blockquote>` : ""}
        <div class="article-signature">🄯 ${CREDITS}</div>
        <div class="article-nav">
          <button type="button" data-go="${i - 1}"><small>Vorheriges Thema</small>${prev.icon} ${prev.title}</button>
          <button type="button" data-go="${i + 1}"><small>Nächstes Thema</small>${next.title} ${next.icon}</button>
        </div>
      </article>`;
    main.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(+b.dataset.go)));
  }

  select(0, false);
  frame();
</script>
</body>
</html>
